<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Completo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>CRUD de tareas</h1>
    <form id="task-form">

      <!-- TITULO -->
      <input
        type="text"
        id="task-title"
        placeholder="Ingrese el titulo"
      >
      <!-- DESCRIPCION -->
      <textarea
        id="task-description"
        placeholder="Ingrese descripcion"
      ></textarea>
      <!-- ESTADO -->
      <select id="task-status">
        <option value="">
          Seleccione estado
        </option>
        <option value="Pendiente">
          Pendiente
        </option>
        <option value="En progreso">
          En progreso
        </option>
        <option value="Completada">
          Completada
        </option>
      </select>

      <!-- BOTON -->
      <button type="submit">
        Guardar tarea
      </button>
    </form>

    <p id="message"></p>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Titulo</th>
          <th>Descripcion</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="task-list"></tbody>
    </table>
  </main>

  <script src="app.js"></script>

</body>

</html>
